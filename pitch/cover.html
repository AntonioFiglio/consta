<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CONSTA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; }

:root {
  --bg:   #FAFAF9;
  --blk:  #0A0A0A;
  --org:  #F97316;
  --verm: #E63946;
  --dim:  #78716C;
  --mono: 'DM Mono', monospace;
  --ui:   'Inter', system-ui, sans-serif;
}

body {
  background: var(--bg);
  font-family: var(--ui);
  overflow: hidden;
  cursor: none;
}

/* ── Cursor ───────────────────────────────── */
#cursor {
  position: fixed; width: 7px; height: 7px; border-radius: 50%;
  background: var(--org); pointer-events: none; z-index: 9999;
  transform: translate(-50%,-50%); opacity: .5;
}

/* ── Canvas ───────────────────────────────── */
#bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; }

/* ── Stage ────────────────────────────────── */
#stage {
  position: fixed; inset: 0; z-index: 10;
  display: flex; align-items: center; justify-content: center;
}

/* ══════════════════════════════════════════
   ENTRANCE ANIMATIONS (fire once on load)
══════════════════════════════════════════ */
@keyframes riseIn {
  from { opacity: 0; transform: translateY(20px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes drawLine {
  from { transform: scaleX(0); }
  to   { transform: scaleX(1); }
}
@keyframes dotPop {
  0%  { transform: scale(0); opacity: 0; }
  60% { transform: scale(1.35); }
  80% { transform: scale(.88); }
  100%{ transform: scale(1); opacity: 1; }
}
@keyframes dotGlow {
  0%,100% {
    text-shadow: 0 0 8px rgba(249,115,22,.5), 0 0 24px rgba(249,115,22,.18);
  }
  50% {
    text-shadow: 0 0 22px rgba(249,115,22,.95), 0 0 52px rgba(249,115,22,.45), 0 0 100px rgba(249,115,22,.12);
  }
}
@keyframes ringOut {
  0%  { transform: translate(-50%,-50%) scale(.3); opacity: .8; }
  100%{ transform: translate(-50%,-50%) scale(8);  opacity: 0; }
}

/* ══════════════════════════════════════════
   CONTEXT LABELS
══════════════════════════════════════════ */
.ctx {
  position: absolute; left: 50%; transform: translateX(-50%);
  font-family: var(--mono); letter-spacing: .18em;
  text-transform: uppercase; white-space: nowrap;
  animation: riseIn .9s cubic-bezier(.16,1,.3,1) both;
}
#ctxTop {
  top: clamp(28px, 4vh, 52px);
  font-size: clamp(9px, .9vw, 12px);
  color: rgba(249,115,22,.65);
  animation-delay: .15s;
}
#ctxBottom {
  bottom: clamp(28px, 4vh, 52px);
  font-size: clamp(9px, .85vw, 11px);
  color: rgba(10,10,10,.22);
  animation-delay: .5s;
}

/* ══════════════════════════════════════════
   CENTER BLOCK
══════════════════════════════════════════ */
.center {
  display: flex; flex-direction: column; align-items: center;
}

/* ── Wordmark ─────────────────────────────── */
.wm-wrap {
  display: flex; align-items: baseline;
  font-family: var(--mono); font-weight: 500;
  font-size: clamp(72px, 17vw, 220px);
  letter-spacing: .04em; line-height: .9;
  animation: riseIn 1s cubic-bezier(.16,1,.3,1) .05s both;
}

.l { display: inline-block; color: var(--blk); }

.dot-wrap { position: relative; display: inline-block; }

.dot-l {
  color: var(--org);
  animation:
    dotPop .6s cubic-bezier(.34,1.56,.64,1) .28s both,
    dotGlow 2.8s ease-in-out 1.2s infinite;
}

/* Burst ring */
.ring {
  position: absolute; top: 50%; left: 50%;
  width: .55em; height: .55em;
  margin-top: -.275em; margin-left: -.275em;
  border: 2px solid var(--org); border-radius: 50%;
  animation: ringOut 1.2s ease-out .9s both;
  pointer-events: none;
}
.ring2 {
  position: absolute; top: 50%; left: 50%;
  width: .55em; height: .55em;
  margin-top: -.275em; margin-left: -.275em;
  border: 1px solid rgba(249,115,22,.5); border-radius: 50%;
  animation: ringOut 1.8s ease-out 1.1s both;
  pointer-events: none;
}

/* ── Divider ──────────────────────────────── */
.divider {
  align-self: stretch; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(249,115,22,.55) 30%, rgba(249,115,22,.55) 70%, transparent);
  margin-top: 20px;
  animation: drawLine .8s cubic-bezier(.16,1,.3,1) .4s both;
  transform-origin: center;
}

/* ── Tagline ──────────────────────────────── */
.tagline {
  margin-top: 22px;
  font-family: var(--ui); font-weight: 300;
  font-size: clamp(14px, 1.6vw, 22px);
  color: var(--dim); letter-spacing: .01em; text-align: center;
  line-height: 1.6;
  animation: riseIn .9s cubic-bezier(.16,1,.3,1) .6s both;
}
.tagline em { font-style: normal; color: var(--org); font-weight: 400; }

/* ── CTA ──────────────────────────────────── */
.cta {
  position: fixed; bottom: clamp(28px,4vh,48px); right: clamp(28px,3vw,48px);
  display: inline-flex; align-items: center; gap: 8px;
  padding: 10px 22px; cursor: pointer;
  border: 1px solid rgba(10,10,10,.14); border-radius: 2px;
  font-family: var(--mono); font-size: 10px; letter-spacing: .18em;
  text-transform: uppercase; color: rgba(10,10,10,.3);
  z-index: 100; transition: color .3s, border-color .3s, background .3s;
  animation: riseIn .8s cubic-bezier(.16,1,.3,1) .9s both;
}
.cta:hover {
  color: var(--org); border-color: var(--org);
  background: rgba(249,115,22,.04);
}

/* ── Fullscreen ───────────────────────────── */
#fsbtn {
  position: fixed; top: clamp(20px,3vh,36px); left: clamp(20px,2.5vw,36px);
  font-size: 14px; color: rgba(10,10,10,.12); z-index: 100;
  cursor: pointer; transition: color .25s; padding: 4px;
}
#fsbtn:hover { color: rgba(10,10,10,.4); }
</style>
</head>
<body>

<div id="cursor"></div>
<canvas id="bg"></canvas>

<main id="stage">

  <div class="ctx" id="ctxTop">
    III Hackathon Saúde &nbsp;·&nbsp; HCFMUSP &nbsp;·&nbsp; 2026
  </div>

  <div class="center">
    <div class="wm-wrap">
      <span class="l">C</span>
      <span class="l">O</span>
      <span class="l">N</span>
      <span class="l">S</span>
      <span class="l">T</span>
      <span class="l">A</span>
      <span class="dot-wrap">
        <span class="l dot-l">.</span>
        <span class="ring"></span>
        <span class="ring2"></span>
      </span>
    </div>

    <div class="divider"></div>

    <div class="tagline">
      Seus equipamentos, sempre <em>constando positivo.</em>
    </div>
  </div>

  <div class="ctx" id="ctxBottom">
    Hub InovaHC &nbsp;·&nbsp; São Paulo &nbsp;·&nbsp; Nov 2026
  </div>

</main>

<div class="cta" id="cta">INICIAR PITCH ↗</div>
<div id="fsbtn" title="F = fullscreen">⛶</div>

<script>
/* ══════════════════════════════════════════
   CANVAS — subtle particles on white
══════════════════════════════════════════ */
const canvas = document.getElementById('bg');
const ctx    = canvas.getContext('2d');

function resize() { canvas.width = innerWidth; canvas.height = innerHeight; }
addEventListener('resize', resize); resize();

const pts = Array.from({length: 55}, () => ({
  x:   Math.random() * canvas.width,
  y:   Math.random() * canvas.height,
  vx:  (Math.random() - .5) * .18,
  vy:  (Math.random() - .5) * .18,
  r:   Math.random() * 1.3 + .3,
  a:   Math.random() * .055 + .012,
  org: Math.random() < .3
}));

const DATA = ['293.000','61%','5×','10K/h','RDC 509','90 dias','1.800','600K','BLE','EQ-04'];
const floats = Array.from({length: 18}, () => ({
  t:  DATA[Math.floor(Math.random() * DATA.length)],
  x:  Math.random() * canvas.width,
  y:  Math.random() * canvas.height,
  vy: -(Math.random() * .12 + .05),
  a:  Math.random() * .022 + .006,
  sz: Math.random() * 10 + 7
}));

function drawFrame() {
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0, 0, W, H);

  /* Warm center radial hint */
  const g = ctx.createRadialGradient(W*.5, H*.5, 0, W*.5, H*.5, Math.min(W,H)*.55);
  g.addColorStop(0, 'rgba(249,115,22,.018)');
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  /* Connections */
  for (let i = 0; i < pts.length; i++) {
    for (let j = i+1; j < pts.length; j++) {
      const dx = pts[i].x - pts[j].x;
      const dy = pts[i].y - pts[j].y;
      const d  = Math.hypot(dx, dy);
      if (d < 100) {
        ctx.beginPath();
        ctx.moveTo(pts[i].x, pts[i].y);
        ctx.lineTo(pts[j].x, pts[j].y);
        ctx.strokeStyle = `rgba(249,115,22,${(1-d/100)*.03})`;
        ctx.lineWidth = .5; ctx.stroke();
      }
    }
  }

  /* Particles */
  pts.forEach(p => {
    p.x += p.vx; p.y += p.vy;
    if (p.x < 0) p.x = W; if (p.x > W) p.x = 0;
    if (p.y < 0) p.y = H; if (p.y > H) p.y = 0;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
    ctx.fillStyle = p.org
      ? `rgba(249,115,22,${p.a})`
      : `rgba(10,10,10,${p.a})`;
    ctx.fill();
  });

  /* Floating data */
  ctx.textBaseline = 'top';
  floats.forEach(f => {
    f.y += f.vy;
    if (f.y < -20) { f.y = H+20; f.x = Math.random()*W; f.t = DATA[Math.floor(Math.random()*DATA.length)]; }
    ctx.font = `${f.sz}px 'DM Mono', monospace`;
    ctx.fillStyle = `rgba(10,10,10,${f.a})`;
    ctx.fillText(f.t, f.x, f.y);
  });

  requestAnimationFrame(drawFrame);
}
requestAnimationFrame(drawFrame);

/* ══════════════════════════════════════════
   CURSOR
══════════════════════════════════════════ */
const curEl = document.getElementById('cursor');
document.addEventListener('mousemove', e => {
  curEl.style.left = e.clientX + 'px';
  curEl.style.top  = e.clientY + 'px';
});

/* ══════════════════════════════════════════
   NAVIGATION
══════════════════════════════════════════ */
function goToDeck() {
  document.body.style.transition = 'opacity .5s';
  document.body.style.opacity = '0';
  setTimeout(() => { window.location.href = 'deck.html'; }, 520);
}

document.getElementById('cta').addEventListener('click', goToDeck);
document.addEventListener('keydown', e => {
  if ([' ','ArrowRight','Enter'].includes(e.key)) { e.preventDefault(); goToDeck(); }
  if (e.key.toLowerCase() === 'f') toggleFS();
});
document.getElementById('bg').addEventListener('click', goToDeck);

/* ══════════════════════════════════════════
   FULLSCREEN
══════════════════════════════════════════ */
function toggleFS() {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{});
  else document.exitFullscreen();
}
document.getElementById('fsbtn').addEventListener('click', e => { e.stopPropagation(); toggleFS(); });
</script>
</body>
</html>
